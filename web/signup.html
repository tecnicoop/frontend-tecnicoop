<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar solicitud — ETec Ltda.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="signup.css" />
  <link rel="icon" type="image/x-icon" href="images/logo-innovatec-2.ico" />
</head>
<body>
  <main class="signup-root">
    <section class="signup-card" role="main" aria-labelledby="signup-title">
      <div class="brand">
        <a href="index.html" class="logo"><img src="images/InnovaTec_logo_wtho_title.svg" alt="InnovaTec" style="height:48px;width:auto"></a>
        <p class="brand-sub">Solicitud de membresía cooperativa</p>
      </div>

      <h1 id="signup-title" class="title">Iniciar solicitud de membresía</h1>

      <!-- Mensaje de validación -->
      <div id="validation-message" class="validation-message" style="display: none;"></div>

      <form class="signup-form" autocomplete="on" novalidate id="signup-form">

        <div class="form-name-row">
          <div class="form-field">
            <label for="nombre">Nombre</label>
            <input
              id="nombre"
              name="nombre"
              type="text"
              inputmode="text"
              autocomplete="given-name"
              required
              placeholder="Tu nombre"
            />
          </div>
          <div class="form-field">
            <label for="apellido">Apellido</label>
            <input
              id="apellido"
              name="apellido"
              type="text"
              inputmode="text"
              autocomplete="family-name"
              required
              placeholder="Tu apellido"
            />
          </div>
        </div>

        <label for="email">Correo electrónico institucional</label>
        <input
          id="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          required
          placeholder="tu@alumno.etec.um.edu.ar"
        />
        <div class="field-hint">Debés usar tu mail institucional @etec.um.edu.ar o @alumno.etec.um.edu.ar</div>

        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
          placeholder="Mínimo 6 caracteres"
          minlength="6"
        />

        <label for="rol">Curso / Rol</label>
        <select id="rol" name="rol" required autocomplete="off">
          <option value="" disabled selected>Seleccioná tu curso o rol</option>
          <option value="1A">1.º A</option>
          <option value="1B">1.º B</option>
          <option value="2A">2.º A</option>
          <option value="2B">2.º B</option>
          <option value="3I">3.º Informática</option>
          <option value="3E">3.º Electrónica</option>
          <option value="4I">4.º Informática</option>
          <option value="4E">4.º Electrónica</option>
          <option value="5I">5.º Informática</option>
          <option value="5E">5.º Electrónica</option>
          <option value="6I">6.º Informática</option>
          <option value="6E">6.º Electrónica</option>
          <option value="no-alumno">No soy alumno</option>
        </select>

        <button type="submit" class="btn-submit" id="submit-btn">Enviar solicitud</button>
      </form>

      <div class="signup-footer">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></div>
      <div class="signup-footer-secondary"><a href="index.html">← Volver a inicio</a></div>
    </section>
  </main>

  <script>
    (function(){
      const API_BASE = '';

      const form = document.getElementById('signup-form');
      const nombreInput = document.getElementById('nombre');
      const apellidoInput = document.getElementById('apellido');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const rolSelect = document.getElementById('rol');
      const validationMessage = document.getElementById('validation-message');
      const submitBtn = document.getElementById('submit-btn');

      /**
       * Dominios de email permitidos
       */
      const ALLOWED_DOMAINS = ['@etec.um.edu.ar', '@alumno.etec.um.edu.ar'];

      function isValidInstitutionalEmail(email) {
        const lower = email.toLowerCase();
        return ALLOWED_DOMAINS.some(d => lower.endsWith(d));
      }

      /**
       * Mostrar mensaje de feedback
       */
      function showMessage(text, type) {
        validationMessage.style.display = 'block';
        validationMessage.className = 'validation-message ' + type;
        validationMessage.innerHTML = '<strong>' + text + '</strong>';
      }

      function hideMessage() {
        validationMessage.style.display = 'none';
      }

      /**
       * Validación en tiempo real del email
       */
      emailInput.addEventListener('input', function() {
        const val = emailInput.value.trim();
        if (val && !isValidInstitutionalEmail(val)) {
          emailInput.setCustomValidity('Usá tu mail institucional @etec.um.edu.ar o @alumno.etec.um.edu.ar');
          emailInput.style.borderColor = '#dc3545';
        } else {
          emailInput.setCustomValidity('');
          emailInput.style.borderColor = val ? 'var(--accent)' : '';
        }
      });

      /**
       * Enviar formulario al backend
       */
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideMessage();

        // Validación HTML5
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const email = emailInput.value.trim();

        // Validar dominio del email
        if (!isValidInstitutionalEmail(email)) {
          showMessage('El email debe ser @etec.um.edu.ar o @alumno.etec.um.edu.ar', 'error');
          return;
        }

        // Validar contraseña
        if (passwordInput.value.length < 6) {
          showMessage('La contraseña debe tener al menos 6 caracteres.', 'error');
          return;
        }

        // Preparar datos
        const data = {
          nombre: nombreInput.value.trim(),
          apellido: apellidoInput.value.trim(),
          email: email,
          password: passwordInput.value,
          rol: rolSelect.value
        };

        // Enviar al backend
        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando solicitud...';

        try {
          const response = await fetch(API_BASE + '/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });

          const result = await response.json();

          if (response.ok) {
            showMessage('✓ Solicitud enviada exitosamente. ' + result.message, 'success');
            // Guardar sesión automáticamente después del registro
            localStorage.setItem('user', JSON.stringify(result.user));
            form.reset();
            setTimeout(function() {
              window.location.href = 'index.html';
            }, 2000);
          } else {
            showMessage(result.error || 'Error al enviar la solicitud.', 'error');
          }
        } catch (err) {
          console.error('Error de conexión:', err);
          showMessage('No se pudo conectar con el servidor. Verificá que el backend esté corriendo.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Enviar solicitud';
        }
      });
    })();
  </script>
</body>
</html>
