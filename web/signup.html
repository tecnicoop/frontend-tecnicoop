<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse — InnovaTec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="signup.css" />
</head>
<body>
  <main class="signup-root">
    <section class="signup-card" role="main" aria-labelledby="signup-title">
      <div class="brand">
        <a href="index.html" class="logo">InnovaTec</a>
        <p class="brand-sub">Crea tu cuenta</p>
      </div>

      <h1 id="signup-title" class="title">Registrarse</h1>

      <form class="signup-form" autocomplete="on" novalidate>
        <label for="name">Nombre completo</label>
        <input id="name" name="name" type="text" inputmode="text" autocomplete="name" required placeholder="Tu nombre" />

        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="tu@ejemplo.com" />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="••••••••" />

        <label for="confirm-password">Confirmar contraseña</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required placeholder="••••••••" />

        <div class="form-row">
          <label class="accept-terms">
            <input type="checkbox" name="terms" required />
            <span>Acepto los <a href="#">términos de servicio</a></span>
          </label>
        </div>

        <button type="submit" class="btn-submit">Crear cuenta</button>
      </form>

      <div class="signup-footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></div>
      <div class="signup-footer-secondary"><a href="index.html">← Volver a inicio</a></div>
    </section>
  </main>

  <script>
    (function(){
      const form = document.querySelector('.signup-form');
      form.addEventListener('submit', function(e){
        e.preventDefault();
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        if (password !== confirmPassword) {
          alert('Las contraseñas no coinciden.');
          return;
        }
        // Placeholder: integrarlo con la lógica real de registro
        alert('Envío simulado — integre su backend aquí.');
      });
    })();
  </script>
</body>
</html>
