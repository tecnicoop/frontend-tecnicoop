<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar solicitud — ETec Ltda.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="signup.css" />
</head>
<body>
  <main class="signup-root">
    <section class="signup-card" role="main" aria-labelledby="signup-title">
      <div class="brand">
        <a href="index.html" class="logo">ETec Ltda.</a>
        <p class="brand-sub">Solicitud de membresía cooperativa</p>
      </div>

      <h1 id="signup-title" class="title">Iniciar solicitud de membresía</h1>

      <!-- Mensaje de validación por Gemini -->
      <div id="validation-message" class="validation-message" style="display: none;"></div>

      <form class="signup-form" autocomplete="on" novalidate id="signup-form">
        <label for="name">Nombre completo</label>
        <input
          id="name"
          name="name"
          type="text"
          inputmode="text"
          autocomplete="name"
          required
          placeholder="Tu nombre completo"
          data-field="name"
        />
        <div class="field-feedback" id="name-feedback"></div>

        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          required
          placeholder="tu@ejemplo.com"
          data-field="email"
        />
        <div class="field-feedback" id="email-feedback"></div>

        <label for="curso">Curso (5.º o 6.º año)</label>
        <input
          id="curso"
          name="curso"
          type="text"
          inputmode="text"
          autocomplete="off"
          required
          placeholder="Ej: 5.º Informática o 6.º Electrónica"
          data-field="curso"
        />
        <div class="field-feedback" id="curso-feedback"></div>

        <label for="motivo">¿Por qué querés ser asociado?</label>
        <textarea
          id="motivo"
          name="motivo"
          required
          placeholder="Contanos tu motivación para formar parte de la cooperativa..."
          data-field="motivo"
          rows="4"
        ></textarea>
        <div class="field-feedback" id="motivo-feedback"></div>

        <div class="form-row">
          <label class="accept-terms">
            <input type="checkbox" name="terms" required />
            <span>Acepto el <a href="#">estatuto social</a> y los principios cooperativos</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Enviar solicitud</button>
      </form>

      <div class="signup-footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></div>
      <div class="signup-footer-secondary"><a href="index.html">← Volver a inicio</a></div>
    </section>
  </main>

  <!-- Cargar el servicio de Gemini -->
  <script src="gemini-service.js"></script>

  <script>
    (function(){
      // Inicializar Gemini Service
      const apiKey = 'AIzaSyDummyKeyForDevelopmentOnly123456789'; // En producción, usar variables de entorno
      const geminiService = new GeminiService(apiKey);
      
      const form = document.getElementById('signup-form');
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const cursoInput = document.getElementById('curso');
      const motivoInput = document.getElementById('motivo');
      const validationMessage = document.getElementById('validation-message');
      const submitBtn = document.getElementById('submit-btn');

      let validationResult = null;

      /**
       * Validar datos con Gemini en tiempo real
       */
      async function validateWithGemini() {
        const userData = {
          name: nameInput.value.trim(),
          email: emailInput.value.trim(),
          curso: cursoInput.value.trim(),
          motivo: motivoInput.value.trim()
        };

        if (!userData.name || !userData.email) {
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Validando...';

        try {
          validationResult = await geminiService.validateSignupData(userData);

          // Mostrar mensaje de validación
          if (validationMessage) {
            validationMessage.style.display = 'block';
            validationMessage.className = `validation-message ${validationResult.isValid ? 'success' : 'error'}`;
            validationMessage.innerHTML = `
              <strong>${validationResult.message}</strong>
              ${validationResult.suggestions.length > 0 ? '<ul>' + validationResult.suggestions.map(s => `<li>${s}</li>`).join('') + '</ul>' : ''}
              ${validationResult.issues.length > 0 ? '<ul class="issues">' + validationResult.issues.map(i => `<li>⚠ ${i}</li>`).join('') + '</ul>' : ''}
            `;
          }
        } catch (error) {
          console.error('Error en validación:', error);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Enviar solicitud';
        }
      }

      /**
       * Debounce para validación en tiempo real
       */
      let validationTimeout;
      function debounceValidation() {
        clearTimeout(validationTimeout);
        validationTimeout = setTimeout(validateWithGemini, 1500);
      }

      // Event listeners para validación en tiempo real
      nameInput.addEventListener('blur', validateWithGemini);
      emailInput.addEventListener('blur', validateWithGemini);
      cursoInput.addEventListener('blur', validateWithGemini);
      motivoInput.addEventListener('blur', validateWithGemini);
      nameInput.addEventListener('input', debounceValidation);
      emailInput.addEventListener('input', debounceValidation);
      cursoInput.addEventListener('input', debounceValidation);
      motivoInput.addEventListener('input', debounceValidation);

      /**
       * Manejar envío del formulario
       */
      form.addEventListener('submit', async function(e){
        e.preventDefault();

        // Validación HTML5
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        // Validación con Gemini (si está disponible)
        if (!validationResult) {
          await validateWithGemini();
        }

        if (validationResult && !validationResult.isValid) {
          validationMessage.style.display = 'block';
          validationMessage.className = 'validation-message error';
          validationMessage.innerHTML = `
            <strong>${validationResult.message}</strong>
            ${validationResult.issues.length > 0 ? '<ul class="issues">' + validationResult.issues.map(i => `<li>⚠ ${i}</li>`).join('') + '</ul>' : ''}
          `;
          return;
        }

        // Si todo es válido, mostrar mensaje de éxito con Gemini
        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando solicitud...';

        try {
          const welcomeMessage = await geminiService.generateWelcomeMessage(nameInput.value);

          validationMessage.style.display = 'block';
          validationMessage.className = 'validation-message success';
          validationMessage.innerHTML = `
            <strong>✓ Solicitud enviada exitosamente</strong>
            <p>${welcomeMessage}</p>
            <p style="margin-top: 12px; font-size: 0.9rem; color: var(--text-2);">
              El consejo de administración revisará tu solicitud. Te contactaremos pronto.
            </p>
          `;

          // Simular envío al backend y redirigir
          setTimeout(() => {
            // En producción: enviar datos al backend
            console.log('Datos de solicitud:', {
              name: nameInput.value,
              email: emailInput.value,
              curso: cursoInput.value,
              motivo: motivoInput.value,
            });
            // Redirigir a página de inicio
            window.location.href = 'index.html';
          }, 3000);
        } catch (error) {
          console.error('Error:', error);
          validationMessage.style.display = 'block';
          validationMessage.className = 'validation-message success';
          validationMessage.innerHTML = `
            <strong>✓ Solicitud enviada exitosamente</strong>
            <p>Tu solicitud ha sido procesada. Te contactaremos pronto.</p>
          `;
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        }
      });
    })();
  </script>
</body>
</html>
